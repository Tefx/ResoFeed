<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#F3F0E7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171A18" media="(prefers-color-scheme: dark)" />
    %sveltekit.head%
    <script>
      {
        const { pathname, search } = window.location;
        const searchKeys = new Set(['q', 'source', 'from', 'to', 'resonated', 'limit']);
        const hasSearchRoute = pathname === '/' && search.slice(1).split('&').some((part) => {
          if (!part) return false;
          const separator = part.indexOf('=');
          const rawKey = separator >= 0 ? part.slice(0, separator) : part;
          try {
            return searchKeys.has(decodeURIComponent(rawKey.replace(/\+/g, ' ')));
          } catch {
            return false;
          }
        });
        const surfaceTitle = pathname === '/doctor'
          ? '/doctor'
          : pathname === '/source-ledger' || pathname === '/source' || pathname === '/sources'
            ? 'SOURCE LEDGER'
            : pathname.startsWith('/items/')
              ? 'INSPECTOR'
              : hasSearchRoute
                ? 'SEARCH'
                : 'TODAY';
        document.title = `RESOFEED · ${surfaceTitle}`;
      }
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div>%sveltekit.body%</div>
  </body>
</html>
